<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Iron Girder Walk VR - Meta Quest Fixed</title>
  <!-- A-Frame 1.6.0 -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #020408;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #vr-guide {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(8, 16, 30, 0.95);
      border: 2px solid #00d2ff;
      border-radius: 12px;
      padding: 14px 24px;
      color: #ffffff;
      text-align: center;
      z-index: 9999;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
      pointer-events: none;
    }
    #vr-guide h2 { margin: 0 0 6px 0; font-size: 17px; color: #00f0ff; }
    #vr-guide p { margin: 2px 0; font-size: 13px; color: #e0e8f0; }
    #vr-guide .em { color: #ffe600; font-weight: bold; }
  </style>

  <script>
    // =========================================================================
    // Web Audio サウンドエンジン（足音・風・落下・ゴール）
    // =========================================================================
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.isReady = false;
      }
      init() {
        if (this.isReady) {
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
          return;
        }
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        this.isReady = true;
        this.startWind();
      }
      startWind() {
        if (!this.ctx) return;
        const bufferSize = this.ctx.sampleRate * 2;
        const noise = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const out = noise.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) out[i] = Math.random() * 2 - 1;

        const white = this.ctx.createBufferSource();
        white.buffer = noise;
        white.loop = true;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 350;
        filter.Q.value = 2.0;

        const gain = this.ctx.createGain();
        gain.gain.value = 0.06;

        white.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        white.start(0);
      }
      playStep() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(420, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.08);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.09);
      }
      playFall() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 1.2);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 1.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 1.2);
      }
      playGoal() {
        if (!this.ctx) return;
        [523, 659, 784, 1046].forEach((f, i) => {
          const now = this.ctx.currentTime + i * 0.12;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = f;
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.6);
        });
      }
    }

    // =========================================================================
    // 正確な推進ロジック（足踏み ＆ コントローラー入力）
    // =========================================================================
    AFRAME.registerComponent('girder-locomotion', {
      schema: {
        beamWidth: { default: 0.5 },
        beamLength: { default: 40.0 },
        fallMargin: { default: 0.30 },
        stepThreshold: { default: 0.015 }, // 1.5cmに調整（微振動による誤検知を抑制）
        maxSpeed: { default: 1.6 }
      },

      init: function () {
        this.rig = this.el;
        this.camera = this.el.querySelector('#head');
        this.sound = new SoundEngine();

        this.currentSpeed = 0.0;
        this.currentStrafe = 0.0;

        // 頭部Y軸（上下動）追跡用
        this.yHistory = [];
        this.windowMs = 300;
        this.lastStepTime = 0;
        this.steps = 0;
        this.calories = 0.0;

        this.isFalling = false;
        this.fallSpeed = 0;
        this.goalReached = false;

        // HUDエレメント取得
        this.hudDist = document.querySelector('#hud-distance');
        this.hudSteps = document.querySelector('#hud-steps');
        this.hudKcal = document.querySelector('#hud-kcal');
        this.hudGauge = document.querySelector('#hud-gauge');
        this.hudAmp = document.querySelector('#hud-amp');
        this.hudDebug = document.querySelector('#hud-debug');
        this.hudStatus = document.querySelector('#hud-status');

        // キーボード（PCテスト用）
        this.keys = {};
        window.addEventListener('keydown', (e) => { this.keys[e.code] = true; });
        window.addEventListener('keyup', (e) => { this.keys[e.code] = false; });

        // サウンド初期化ハンドラ
        const unlockAudio = () => { this.sound.init(); };
        this.el.sceneEl.addEventListener('enter-vr', () => {
          unlockAudio();
          const guide = document.getElementById('vr-guide');
          if (guide) guide.style.display = 'none';
        });
        window.addEventListener('click', unlockAudio, { once: true });
        window.addEventListener('triggerdown', unlockAudio);
      },

      // Meta Quest Touchコントローラー（WebXR xr-standard サムスティック対応）
      getStickInput: function () {
        let x = 0;
        let y = 0;
        const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];

        for (let i = 0; i < gamepads.length; i++) {
          const gp = gamepads[i];
          if (!gp || !gp.axes || gp.axes.length < 2) continue;

          // 4軸以上の場合はサムスティック（axes[2], axes[3]）を優先
          const rawX = gp.axes.length >= 4 ? gp.axes[2] : gp.axes[0];
          const rawY = gp.axes.length >= 4 ? gp.axes[3] : gp.axes[1];

          // 左右コントローラーの絶対値が大きい入力を採用
          if (Math.abs(rawX) > 0.20 && Math.abs(rawX) > Math.abs(x)) x = rawX;
          if (Math.abs(rawY) > 0.20 && Math.abs(rawY) > Math.abs(y)) y = rawY;
        }
        return { x: x, y: y };
      },

      tick: function (time, timeDelta) {
        if (!timeDelta) return;
        const dt = Math.min(timeDelta / 1000, 0.1);
        const now = performance.now();
        const rigPos = this.rig.object3D.position;

        // カメラ（HMD）のワールド座標を取得
        const headWorldPos = new THREE.Vector3();
        this.camera.object3D.getWorldPosition(headWorldPos);

        // -------------------------------------------------------------
        // 1. 落下処理
        // -------------------------------------------------------------
        if (this.isFalling) {
          this.fallSpeed += 25.0 * dt;
          rigPos.y -= this.fallSpeed * dt;
          this.rig.object3D.rotation.z += 0.5 * dt;
          if (rigPos.y < -90) this.respawn();
          return;
        }

        // -------------------------------------------------------------
        // 2. ヘッドセットの上下バウンス（足踏み）解析
        // -------------------------------------------------------------
        const currentY = headWorldPos.y;
        this.yHistory.push({ time: now, y: currentY });
        while (this.yHistory.length > 0 && (now - this.yHistory[0].time) > this.windowMs) {
          this.yHistory.shift();
        }

        let minY = Infinity, maxY = -Infinity;
        for (let i = 0; i < this.yHistory.length; i++) {
          const val = this.yHistory[i].y;
          if (val < minY) minY = val;
          if (val > maxY) maxY = val;
        }
        const amp = (maxY - minY); // 上下の振幅（m）

        // HUDメーター更新
        const threshold = this.data.stepThreshold;
        const ratio = Math.min(Math.max(amp / (threshold * 2.5), 0.05), 1.0);
        if (this.hudGauge) {
          this.hudGauge.setAttribute('scale', `${ratio} 1 1`);
          this.hudGauge.setAttribute('material', 'color', amp >= threshold ? '#00ff88' : '#336699');
        }
        if (this.hudAmp) {
          this.hudAmp.setAttribute('value', `BOUNCE: ${(amp * 100).toFixed(1)}cm / THRES: ${(threshold * 100).toFixed(1)}cm`);
        }

        // 足踏み検知
        let isSteppingNow = false;
        if (amp >= threshold && (now - this.lastStepTime > 260)) {
          this.steps++;
          this.calories += 0.04;
          this.lastStepTime = now;
          this.sound.playStep();

          this.currentSpeed = Math.min(this.data.maxSpeed, this.currentSpeed + 1.1);
          isSteppingNow = true;

          if (this.hudSteps) this.hudSteps.setAttribute('value', `STEPS: ${this.steps}`);
          if (this.hudKcal) this.hudKcal.setAttribute('value', `KCAL: ${this.calories.toFixed(1)}`);
        }

        // -------------------------------------------------------------
        // 3. スティック入力 & キーボード
        // -------------------------------------------------------------
        const stick = this.getStickInput();
        let stickForward = 0;
        let stickStrafe = 0;

        if (stick.y < -0.20) {
          stickForward = (-stick.y) * this.data.maxSpeed;
        } else if (stick.y > 0.35) {
          stickForward = (-stick.y) * (this.data.maxSpeed * 0.4);
        }

        if (Math.abs(stick.x) > 0.20) {
          stickStrafe = stick.x * 0.6;
        }

        // PCキーボード入力
        if (this.keys['KeyW'] || this.keys['ArrowUp'] || this.keys['Space']) stickForward = this.data.maxSpeed;
        if (this.keys['KeyS'] || this.keys['ArrowDown']) stickForward = -this.data.maxSpeed * 0.4;
        if (this.keys['KeyA'] || this.keys['ArrowLeft']) stickStrafe = -0.6;
        if (this.keys['KeyD'] || this.keys['ArrowRight']) stickStrafe = 0.6;

        if (stickForward > 0) {
          this.currentSpeed = Math.max(this.currentSpeed, stickForward);
        } else if (stickForward < 0 && !isSteppingNow && amp < threshold) {
          this.currentSpeed = stickForward;
        }
        this.currentStrafe = stickStrafe;

        // 減速停止
        if (amp < threshold && Math.abs(stickForward) < 0.05) {
          this.currentSpeed = Math.max(0, this.currentSpeed - 3.5 * dt);
        }

        // デバッグ表示
        if (this.hudDebug) {
          this.hudDebug.setAttribute('value', `Spd:${this.currentSpeed.toFixed(2)} | StkY:${stick.y.toFixed(2)} | StkX:${stick.x.toFixed(2)}`);
        }

        // -------------------------------------------------------------
        // 4. 水平前進ベクトルの算出（ジンバルロック回避・視線追従）
        // -------------------------------------------------------------
        if (Math.abs(this.currentSpeed) > 0.01 || Math.abs(this.currentStrafe) > 0.01) {
          const forward = new THREE.Vector3();
          this.camera.object3D.getWorldDirection(forward);
          forward.y = 0; // 足元を見下ろしても水平面のみに投影
          if (forward.lengthSq() > 0.001) {
            forward.normalize();
          } else {
            forward.set(0, 0, -1);
          }

          // 水平右ベクトルを外積で算出
          const right = new THREE.Vector3();
          right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

          // カメラリグの位置を加算
          rigPos.addScaledVector(forward, this.currentSpeed * dt);
          rigPos.addScaledVector(right, this.currentStrafe * dt);
        }

        // -------------------------------------------------------------
        // 5. 進行度・落下判定（頭のワールド座標で判定）
        // -------------------------------------------------------------
        const headZ = headWorldPos.z;
        const headX = headWorldPos.x;
        const progress = Math.max(0, Math.min(this.data.beamLength, 0.0 - headZ));

        if (this.hudDist) {
          this.hudDist.setAttribute('value', `${progress.toFixed(1)}m / ${this.data.beamLength.toFixed(1)}m`);
        }

        // ゴール判定 (Z = -40m)
        if (headZ <= -this.data.beamLength && !this.goalReached) {
          this.goalReached = true;
          this.sound.playGoal();
          if (this.hudStatus) {
            this.hudStatus.setAttribute('value', '★ GOAL REACHED! ★');
            this.hudStatus.setAttribute('color', '#ffff00');
          }
          return;
        }

        // 鉄骨からの落下判定（スタート足場を出てからゴール手前まで）
        if (headZ < -0.5 && headZ > -this.data.beamLength) {
          if (Math.abs(headX) > this.data.fallMargin) {
            this.triggerFall();
          }
        }
      },

      triggerFall: function () {
        this.isFalling = true;
        this.fallSpeed = 2.0;
        this.sound.playFall();
        if (this.hudStatus) {
          this.hudStatus.setAttribute('value', 'FALLING!');
          this.hudStatus.setAttribute('color', '#ff2222');
        }
      },

      respawn: function () {
        this.isFalling = false;
        this.fallSpeed = 0;
        this.currentSpeed = 0;
        this.currentStrafe = 0;
        this.rig.object3D.position.set(0, 0, 1.2);
        this.rig.object3D.rotation.set(0, 0, 0);
        if (this.hudStatus) {
          this.hudStatus.setAttribute('value', 'STEP IN PLACE TO MOVE');
          this.hudStatus.setAttribute('color', '#00f0ff');
        }
      }
    });

    // 摩天楼背景
    AFRAME.registerComponent('skyscraper-city', {
      init: function () {
        const scene = this.el;
        for (let i = 0; i < 75; i++) {
          const b = document.createElement('a-box');
          const height = 40 + Math.random() * 160;
          const x = (Math.random() - 0.5) * 360;
          const z = -Math.random() * 120 + 20;
          if (Math.abs(x) < 8) continue;

          b.setAttribute('width', 15 + Math.random() * 25);
          b.setAttribute('depth', 15 + Math.random() * 25);
          b.setAttribute('height', height);
          b.setAttribute('position', `${x} ${-280 + height / 2} ${z}`);

          const hue = 210 + Math.random() * 25;
          const light = 12 + Math.random() * 12;
          b.setAttribute('material', `color: hsl(${hue}, 40%, ${light}%); roughness: 0.7; metalness: 0.4;`);
          scene.appendChild(b);
        }
      }
    });
  </script>
</head>

<body>
  <div id="vr-guide">
    <h2>🥽 Meta Quest ブラウザでの開始手順</h2>
    <p>右下の<span class="em">「VR」アイコン</span>をクリックして没入モードに入ってください。</p>
    <p>その場で<span class="em">「トントンと足踏み」</span>すると鉄骨を前に進みます！</p>
  </div>

  <a-scene
    skyscraper-city
    renderer="antialias: true; colorManagement: true; foveationLevel: 2;"
    vr-mode-ui="enabled: true;"
    background="color: #030814">

    <!-- ライト -->
    <a-entity light="type: ambient; color: #4a6890; intensity: 0.9;"></a-entity>
    <a-entity light="type: directional; color: #aadcff; intensity: 1.2;" position="15 30 10"></a-entity>

    <!-- プレイヤー（Camera Rig） -->
    <a-entity id="rig" position="0 0 1.2" girder-locomotion>
      <a-camera id="head" position="0 1.6 0" look-controls="pointerLockEnabled: false">
        
        <!-- フィットネスHUD（視界下部に固定） -->
        <a-entity id="hud" position="0 -0.32 -0.8" rotation="-18 0 0">
          <a-plane width="0.90" height="0.40" material="color: #060d1a; opacity: 0.92; transparent: true;"></a-plane>

          <!-- 距離・歩数・カロリー -->
          <a-text id="hud-distance" value="0.0m / 40.0m" position="-0.40 0.13 0.01" scale="0.27 0.27 0.27" color="#00ffff" font="roboto"></a-text>
          <a-text id="hud-steps" value="STEPS: 0" position="0.04 0.13 0.01" scale="0.24 0.24 0.24" color="#00ff88" font="roboto"></a-text>
          <a-text id="hud-kcal" value="KCAL: 0.0" position="0.25 0.13 0.01" scale="0.24 0.24 0.24" color="#ffaa00" font="roboto"></a-text>

          <!-- 上下動メーター -->
          <a-plane position="0 0.04 0.005" width="0.78" height="0.026" color="#162238"></a-plane>
          <a-plane id="hud-gauge" position="-0.39 0.04 0.01" width="0.78" height="0.022" color="#00ff88" scale="0.05 1 1"></a-plane>

          <!-- 上下動測定値（欧文表示で文字化け回避） -->
          <a-text id="hud-amp" value="BOUNCE: 0.0cm / THRES: 1.5cm" position="-0.40 -0.01 0.01" scale="0.20 0.20 0.20" color="#88bbee" font="roboto"></a-text>
          
          <!-- 入力デバッグ表示 -->
          <a-text id="hud-debug" value="Spd:0.00 | StkY:0.00 | StkX:0.00" position="-0.40 -0.07 0.01" scale="0.18 0.18 0.18" color="#a0c0d0" font="roboto"></a-text>

          <!-- ステータス（欧文表示で文字化け回避） -->
          <a-text id="hud-status" value="STEP IN PLACE TO MOVE" align="center" position="0 -0.14 0.01" scale="0.23 0.23 0.23" color="#00f0ff" font="roboto"></a-text>
        </a-entity>

      </a-camera>

      <a-entity id="leftHand" oculus-touch-controls="hand: left"></a-entity>
      <a-entity id="rightHand" oculus-touch-controls="hand: right"></a-entity>
    </a-entity>

    <!-- スタート足場 -->
    <a-box position="0 -0.1 1.8" width="2.6" depth="2.6" height="0.2" material="color: #223046; metalness: 0.6; roughness: 0.4"></a-box>
    <a-box position="0 -0.05 0.55" width="0.8" depth="0.2" height="0.1" material="color: #eedd00"></a-box>

    <!-- 鉄骨（幅50cm、長さ40m、Z: 0 から -40m） -->
    <a-box position="0 -0.15 -20" width="0.5" depth="40" height="0.3" material="color: #3b4d66; metalness: 0.7; roughness: 0.3"></a-box>
    <a-plane position="0 -0.001 -20" rotation="-90 0 0" width="0.04" height="40" material="color: #55aaff; opacity: 0.6; transparent: true"></a-plane>

    <!-- ゴール足場 -->
    <a-box position="0 -0.1 -41.5" width="3.2" depth="3.2" height="0.2" material="color: #1a4433; metalness: 0.6; roughness: 0.4"></a-box>
    <a-cylinder position="0 0.5 -41.5" radius="0.8" height="1.0" material="color: #00ffaa; opacity: 0.35; transparent: true"></a-cylinder>

    <!-- 下界（地上300m） -->
    <a-plane position="0 -280 0" rotation="-90 0 0" width="1200" height="1200" material="color: #03060f; metalness: 0.1; roughness: 0.9"></a-plane>
    <a-plane position="0 -110 -20" rotation="-90 0 0" width="300" height="300" material="color: #6080aa; opacity: 0.12; transparent: true"></a-plane>
  </a-scene>
</body>
</html>
